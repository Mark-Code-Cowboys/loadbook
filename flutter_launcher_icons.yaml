# Launcher icon generation: dart run flutter_launcher_icons
# Source art is generated (tool/make_icon.py): warm brass #8C6A3F
# ground, an open notebook with a target roundel — notebook and target
# only, per the store-policy rails (§4).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#8C6A3F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
